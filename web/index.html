<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>WebToExe</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #111827;
        color: #f9fafb;
        font: 15px/1.6 "Segoe UI", sans-serif;
      }
      main { width: min(560px, 100%); text-align: center; }
      .mark {
        width: 72px; height: 72px; display: grid; place-items: center;
        margin: 0 auto 24px; border-radius: 22px;
        background: #1e4070; font-size: 32px; font-weight: 800;
      }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.7px; }
      p { margin: 0; color: #9ca3af; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">W</div>
      <h1>WebToExe</h1>
      <p>This is the local development fallback page. Build requests load their configured website directly.</p>
    </main>
  </body>
</html>
