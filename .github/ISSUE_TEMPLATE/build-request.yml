name: Build a Windows app
description: Request a dedicated Windows EXE for a website.
title: "[Build Request] "
body:
  - type: markdown
    attributes:
      value: |
        ## Create your website app
        Submit an HTTPS website address and choose the app settings.
        A Windows EXE and MSI will be built and linked in this issue.
        Do not enter passwords, authentication codes, or other private information.
  - type: input
    id: website_url
    attributes:
      label: Website URL
      description: Enter the full public website address. HTTPS is required.
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: application_name
    attributes:
      label: Application name
      description: This name appears in the app window and installer.
      placeholder: Example App
    validations:
      required: true
  - type: input
    id: window_width
    attributes:
      label: Window width
      description: Optional width in pixels. Allowed range is 600–2560.
      placeholder: "1280"
      value: "1280"
    validations:
      required: false
  - type: input
    id: window_height
    attributes:
      label: Window height
      description: Optional height in pixels. Allowed range is 400–1600.
      placeholder: "800"
      value: "800"
    validations:
      required: false
  - type: textarea
    id: application_icon
    attributes:
      label: Application icon (optional)
      description: Drag and drop a PNG, JPG, or ICO file into this field. GitHub will add an attachment link. Leave empty to use a generated default icon.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Before submitting
      options:
        - label: I understand this app displays the website online and does not bypass its login, subscription, or access restrictions.
          required: true
  - type: dropdown
    id: context_menu
    attributes:
      label: Right-click context menu
      description: Allow or block the website's right-click menu.
      options:
        - Enabled
        - Disabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: allow_maximize
    attributes:
      label: Maximize button
      description: Allow the user to maximize the app window.
      options:
        - Enabled
        - Disabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: allow_resize
    attributes:
      label: Resize window
      description: Allow resizing the app window by dragging its edges.
      options:
        - Enabled
        - Disabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: allow_minimize
    attributes:
      label: Minimize button
      description: Allow minimizing the app window.
      options:
        - Enabled
        - Disabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: show_titlebar
    attributes:
      label: Native title bar and borders
      description: Show the standard Windows title bar, border, and window controls.
      options:
        - Enabled
        - Disabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: start_maximized
    attributes:
      label: Start maximized
      description: Open the app maximized when it launches. Requires resizing and maximizing to be enabled.
      options:
        - Disabled
        - Enabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: start_fullscreen
    attributes:
      label: Start in fullscreen
      description: Open the app in fullscreen mode without the normal window frame.
      options:
        - Disabled
        - Enabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: always_on_top
    attributes:
      label: Always on top
      description: Keep this app above other windows.
      options:
        - Disabled
        - Enabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: zoom_shortcuts
    attributes:
      label: Page zoom shortcuts
      description: Allow Ctrl+Plus, Ctrl+Minus, and Ctrl+0 to change page zoom.
      options:
        - Enabled
        - Disabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: show_in_taskbar
    attributes:
      label: Show in Windows taskbar
      description: Show the app icon in the Windows taskbar.
      options:
        - Enabled
        - Disabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: prevent_screenshots
    attributes:
      label: Prevent screenshots and screen capture
      description: Ask Windows to exclude the app window from supported screen-capture tools. Not a guarantee against every capture method.
      options:
        - Disabled
        - Enabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: website_drag_drop
    attributes:
      label: Website file drag-and-drop
      description: Keep HTML5 drag-and-drop working inside the website, for example dragging files into upload areas.
      options:
        - Enabled
        - Disabled
      default: 1
    validations:
      required: true
  - type: dropdown
    id: app_theme
    attributes:
      label: App and WebView theme
      description: Choose the initial Windows/WebView theme. The website may still apply its own theme.
      options:
        - System
        - Light
        - Dark
      default: 1
    validations:
      required: true
